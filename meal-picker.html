<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日吃啥 · 饭菜随机选择器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #ff7043;
    --primary-dark: #f4511e;
    --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    --panel: rgba(255, 255, 255, 0.06);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #f5f5f5;
    --text-dim: #9fa8bd;
  }

  html, body { height: 100%; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    background: var(--bg);
    background-attachment: fixed;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px 16px;
  }

  header { text-align: center; margin-bottom: 8px; }

  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ffb74d, #ff7043, #ffca28);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p { color: var(--text-dim); margin-top: 4px; font-size: clamp(.78rem, 2vw, .9rem); }

  /* ---------- 抽奖机主体 ---------- */
  .machine {
    width: 100%;
    max-width: 760px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 12px 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(10px);
  }

  /* 两栏：宽屏并排，窄屏纵向堆叠 */
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 560px) {
    .columns { grid-template-columns: 1fr; }
    .machine { padding: 12px; }
  }

  .slot { text-align: center; }

  .slot-title {
    display: inline-block;
    font-size: .82rem;
    font-weight: bold;
    color: #0f3460;
    background: linear-gradient(135deg, #ffd54f, #ffb74d);
    padding: 2px 16px;
    border-radius: 999px;
    margin-bottom: 6px;
    letter-spacing: 2px;
    box-shadow: 0 4px 12px rgba(255, 183, 77, .35);
  }

  /* 滚动窗口 */
  .window {
    position: relative;
    height: 68px;
    overflow: hidden;
    border-radius: 12px;
    background: linear-gradient(180deg, #0b1628, #122036);
    border: 2px solid var(--panel-border);
    box-shadow: inset 0 8px 14px rgba(0, 0, 0, .55), inset 0 -8px 14px rgba(0, 0, 0, .55);
  }

  /* 上下渐隐遮罩 */
  .window::before, .window::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 16px;
    z-index: 2;
    pointer-events: none;
  }
  .window::before { top: 0;    background: linear-gradient(180deg, #0b1628, transparent); }
  .window::after  { bottom: 0; background: linear-gradient(0deg,  #0b1628, transparent); }

  /* 中间高亮选中条 */
  .highlight-bar {
    position: absolute;
    left: 6px; right: 6px;
    top: 50%;
    height: 44px;
    transform: translateY(-50%);
    border: 2px dashed rgba(255, 183, 77, .55);
    border-radius: 10px;
    z-index: 1;
    pointer-events: none;
  }

  /* 滚动列表 */
  .track { will-change: transform; }

  .item {
    height: 44px;
    line-height: 44px;
    font-size: 1.05rem;
    font-weight: bold;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 12px;
  }

  .item.active {
    color: #ffd54f;
    text-shadow: 0 0 12px rgba(255, 213, 79, .6);
    font-size: 1.15rem;
  }

  /* ---------- 开始按钮 ---------- */
  .controls { text-align: center; margin-top: 12px; }

  #startBtn {
    font-family: inherit;
    font-size: 1.02rem;
    font-weight: bold;
    letter-spacing: 5px;
    color: #fff;
    padding: 10px 40px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff7043, #f4511e);
    box-shadow: 0 8px 24px rgba(244, 81, 30, .45);
    transition: transform .15s ease, box-shadow .15s ease, filter .2s;
  }

  #startBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(244, 81, 30, .55); }
  #startBtn:active:not(:disabled) { transform: translateY(0); }
  #startBtn:disabled { filter: grayscale(.6) brightness(.7); cursor: not-allowed; box-shadow: none; }

  #resultHint {
    margin-top: 8px;
    color: var(--text-dim);
    font-size: .85rem;
    min-height: 1.2em;
  }

  /* ---------- 菜谱步骤 ---------- */
  #recipeArea {
    width: 100%;
    max-width: 760px;
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: start;
  }

  @media (max-width: 640px) {
    #recipeArea { grid-template-columns: 1fr; }
  }

  .recipe-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .35);
    animation: fadeUp .45s ease both;
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 4px 12px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .recipe-card h2 {
    grid-column: 1 / -1;
    font-size: 1.02rem;
    color: #ffd54f;
    margin-bottom: 0;
  }

  .recipe-card .tag {
    grid-column: 1 / -1;
    justify-self: start;
    display: inline-block;
    font-size: .68rem;
    color: var(--text-dim);
    background: rgba(255,255,255,.08);
    border-radius: 999px;
    padding: 1px 10px;
    margin-bottom: 2px;
  }

  .recipe-card ol {
    grid-column: 2;
    padding-left: 0;
    list-style: none;
    counter-reset: step;
  }

  .recipe-card li {
    counter-increment: step;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 4px 0;
    color: #dfe4ee;
    font-size: .82rem;
    line-height: 1.5;
    border-bottom: 1px dashed rgba(255,255,255,.08);
  }
  .recipe-card li:last-child { border-bottom: none; }

  .recipe-card li::before {
    content: counter(step);
    flex: none;
    width: 18px; height: 18px;
    line-height: 18px;
    text-align: center;
    border-radius: 50%;
    font-size: .68rem;
    font-weight: bold;
    color: #0f3460;
    background: linear-gradient(135deg, #ffd54f, #ffb74d);
    margin-top: 1px;
  }

  .recipe-img {
    grid-column: 1;
    grid-row: 3;
    width: 92px;
    height: 92px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    margin: 0;
    align-self: start;
    border: 1px solid var(--panel-border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    cursor: pointer;
    transition: transform .25s ease;
  }
  .recipe-img:hover { transform: scale(1.03); }

  .empty-tip {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-dim);
    font-size: .95rem;
    padding: 30px 0;
    border: 1px dashed var(--panel-border);
    border-radius: 16px;
  }

  /* ---------- 设置按钮 ---------- */
  #settingsBtn, #historyBtn {
    margin-left: 8px;
    font-family: inherit;
    font-size: .88rem;
    color: var(--text-dim);
    padding: 9px 16px;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    cursor: pointer;
    background: transparent;
    transition: color .2s, border-color .2s, background .2s;
  }
  #settingsBtn:hover, #historyBtn:hover { color: #ffd54f; border-color: rgba(255, 213, 79, .5); background: rgba(255, 213, 79, .08); }

  /* ---------- 菜谱图片 ---------- */
  .img-lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: zoom-out;
  }
  .img-lightbox.show { display: flex; }
  .img-lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }

  /* ---------- 自定义配置弹窗 ---------- */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 90;
    padding: 16px;
  }
  .modal-mask.show { display: flex; }

  .modal {
    background: #16213e;
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    width: 100%;
    max-width: 680px;
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
    animation: fadeUp .3s ease both;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--panel-border);
  }
  .modal-header h3 { font-size: 1.1rem; color: #ffd54f; }
  .modal-close {
    background: none; border: none; color: var(--text-dim);
    font-size: 1.4rem; cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: #fff; }

  .modal-body { overflow-y: auto; padding: 16px 20px; flex: 1; }

  .cfg-cat-title {
    font-size: .95rem;
    font-weight: bold;
    color: #ffb74d;
    margin: 14px 0 8px;
  }

  .cfg-dish {
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 12px;
  }

  .cfg-img-box { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .cfg-preview {
    width: 92px; height: 69px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #0b1628;
  }
  .cfg-upload-btn {
    font-size: .72rem;
    color: var(--text-dim);
    background: rgba(255,255,255,.08);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    transition: color .2s;
  }
  .cfg-upload-btn:hover { color: #ffd54f; }

  .cfg-fields { display: flex; flex-direction: column; gap: 8px; }

  .cfg-fields input, .cfg-fields textarea {
    font-family: inherit;
    font-size: .85rem;
    color: var(--text);
    background: #0b1628;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 7px 10px;
    outline: none;
    resize: vertical;
  }
  .cfg-fields input:focus, .cfg-fields textarea:focus { border-color: #ffb74d; }
  .cfg-fields textarea { min-height: 72px; line-height: 1.6; }

  .modal-footer {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    padding: 14px 20px;
    border-top: 1px solid var(--panel-border);
  }
  .modal-footer button {
    font-family: inherit;
    font-size: .9rem;
    padding: 9px 22px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
  }
  #cfgResetBtn { background: rgba(255,255,255,.1); color: var(--text-dim); }
  #cfgResetBtn:hover { color: #ff8a80; }
  #cfgSaveBtn { background: linear-gradient(135deg, #ff7043, #f4511e); color: #fff; font-weight: bold; }

  /* ---------- 历史记录 ---------- */
  .history-list { display: flex; flex-direction: column; gap: 10px; }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    animation: fadeUp .3s ease both;
  }

  .history-item .hi-date {
    flex: none;
    color: var(--text-dim);
    font-size: .78rem;
    line-height: 1.5;
    text-align: left;
    min-width: 108px;
  }

  .history-item .hi-dishes {
    flex: 1;
    text-align: left;
    font-size: .92rem;
    color: #dfe4ee;
  }
  .history-item .hi-dishes b { color: #ffd54f; }

  .history-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: .9rem;
    padding: 36px 0;
  }

  #historyClearBtn {
    background: rgba(255,255,255,.1);
    color: var(--text-dim);
  }
  #historyClearBtn:hover { color: #ff8a80; }

  footer { margin-top: 10px; color: var(--text-dim); font-size: .78rem; }
</style>
</head>
<body>

<header>
  <h1>🍳 今日吃啥 · 随机选菜</h1>
  <p>点击下方按钮，让命运决定你的一荤一素</p>
</header>

<div class="machine">
  <div class="columns">
    <div class="slot">
      <span class="slot-title">🥩 荤菜区</span>
      <div class="window">
        <div class="highlight-bar"></div>
        <div class="track" id="trackMeat"></div>
      </div>
    </div>
    <div class="slot">
      <span class="slot-title">🥬 素菜区</span>
      <div class="window">
        <div class="highlight-bar"></div>
        <div class="track" id="trackVeg"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn">开 始</button>
    <button id="settingsBtn" title="自定义菜单与图片">⚙️ 自定义</button>
    <button id="historyBtn" title="查看抽奖记录">📜 记录</button>
    <div id="resultHint">祝你好胃口！</div>
  </div>
</div>

<div id="recipeArea">
  <div class="empty-tip">抽取结果将在这里展示具体做法～</div>
</div>

<!-- 图片放大灯箱 -->
<div class="img-lightbox" id="imgLightbox">
  <img id="lightboxImg" src="" alt="菜品大图">
</div>

<!-- 自定义配置弹窗 -->
<div class="modal-mask" id="cfgModal">
  <div class="modal">
    <div class="modal-header">
      <h3>⚙️ 自定义菜单配置</h3>
      <button class="modal-close" id="cfgCloseBtn" title="关闭">×</button>
    </div>
    <div class="modal-body" id="cfgBody"></div>
    <div class="modal-footer">
      <button id="cfgResetBtn">恢复默认</button>
      <button id="cfgSaveBtn">保存配置</button>
    </div>
  </div>
</div>

<!-- 历史记录弹窗 -->
<div class="modal-mask" id="historyModal">
  <div class="modal">
    <div class="modal-header">
      <h3>📜 抽奖记录</h3>
      <button class="modal-close" id="historyCloseBtn" title="关闭">×</button>
    </div>
    <div class="modal-body" id="historyBody"></div>
    <div class="modal-footer">
      <button id="historyClearBtn">清空记录</button>
    </div>
  </div>
</div>

<footer>随机 · 公平 · 不挑食 😋</footer>

<script>
/* ================= 菜谱数据 ================= */
const MEAT_MENU = [
  { name: "宫保鸡丁", steps: [
    "鸡胸肉切丁，用料酒、生抽、淀粉腌制 15 分钟",
    "花生米小火炸至酥脆，捞出备用",
    "调碗汁：生抽 2 勺、醋 1 勺、糖 1 勺、淀粉少许、清水 2 勺",
    "热油下干辣椒和花椒炒香，倒入鸡丁滑炒至变色",
    "加入葱段翻炒，淋入碗汁收浓",
    "最后倒入花生米，快速翻匀出锅"
  ]},
  { name: "红烧肉", steps: [
    "五花肉切 3cm 方块，冷水下锅焯水去浮沫",
    "锅中少油，放冰糖小火炒出琥珀色糖色",
    "下五花肉翻炒上色，加葱段、姜片、八角",
    "烹入料酒，加生抽、老抽，倒入热水没过肉",
    "大火烧开转小火，加盖炖 50 分钟",
    "开盖大火收汁，汤汁浓稠亮油即可"
  ]},
  { name: "鱼香肉丝", steps: [
    "猪里脊切丝，用盐、料酒、淀粉腌制 10 分钟",
    "木耳、胡萝卜、青椒切丝，泡椒剁碎",
    "调鱼香汁：糖、醋、生抽、淀粉、清水按 1:1:1:0.5:2 混合",
    "热油滑炒肉丝至变色盛出",
    "底油爆香泡椒和蒜末姜末，下配菜丝翻炒",
    "倒回肉丝，淋鱼香汁，大火收匀出锅"
  ]},
  { name: "糖醋排骨", steps: [
    "肋排剁段，冷水下锅焯水后沥干",
    "调糖醋汁：料酒 1 勺、生抽 2 勺、糖 3 勺、醋 4 勺、清水 5 勺",
    "排骨煎至两面微黄",
    "倒入糖醋汁，加热水没过排骨",
    "大火烧开转小火焖煮 30 分钟",
    "大火收汁至浓稠，撒白芝麻出锅"
  ]},
  { name: "清蒸鲈鱼", steps: [
    "鲈鱼洗净，两面划几刀，用料酒和姜片腌 10 分钟",
    "盘底垫葱段姜片，放上鲈鱼",
    "水开后上锅，大火蒸 8 分钟",
    "倒掉盘中蒸出的汤汁，去掉姜葱",
    "铺上新的葱丝、姜丝，淋蒸鱼豉油",
    "烧一勺热油浇在葱丝上激出香味"
  ]},
  { name: "土豆炖牛腩", steps: [
    "牛腩切块焯水，土豆去皮切滚刀块",
    "热油爆香姜蒜、八角、桂皮，下牛腩翻炒",
    "加生抽、老抽、料酒炒匀上色",
    "加热水没过牛腩，小火炖 60 分钟",
    "加入土豆块，继续炖 20 分钟至软糯",
    "加盐调味，大火稍微收汁即可"
  ]}
];

const VEG_MENU = [
  { name: "麻婆豆腐", steps: [
    "嫩豆腐切块，盐水焯 1 分钟捞出",
    "热油炒肉末至酥香（素版可省略）",
    "加豆瓣酱炒出红油，放蒜末姜末",
    "倒入豆腐，加生抽和高汤，轻推匀",
    "中小火烧 3 分钟，分两次淋水淀粉勾芡",
    "撒花椒粉和葱花出锅"
  ]},
  { name: "地三鲜", steps: [
    "土豆、茄子切滚刀块，青椒切块",
    "茄子撒盐腌 10 分钟，挤出水分",
    "土豆和茄子分别炸至金黄捞出",
    "底油爆香蒜末，下青椒翻炒",
    "倒入土豆茄子，加生抽、糖、少许盐",
    "淋水淀粉勾薄芡，翻匀出锅"
  ]},
  { name: "干煸四季豆", steps: [
    "四季豆掰段，洗净晾干水分",
    "油温六成热下四季豆，炸至表皮起皱捞出",
    "底油爆香蒜末、干辣椒和花椒",
    "可加少许肉末炒散",
    "倒入四季豆大火翻炒",
    "加盐、少许糖和生抽翻匀出锅"
  ]},
  { name: "蒜蓉西兰花", steps: [
    "西兰花掰小朵，盐水浸泡后洗净",
    "水开加少许盐和油，焯西兰花 1 分钟捞出",
    "热油下蒜末爆香",
    "倒入西兰花大火快炒",
    "加盐、少许蚝油调味",
    "翻炒均匀即可出锅，保持脆嫩"
  ]},
  { name: "醋溜白菜", steps: [
    "白菜帮斜刀片成薄片，叶分开",
    "调碗汁：醋 2 勺、糖 1 勺、生抽 1 勺、淀粉少许",

const CONFIG_KEY = "mealPickerConfig";
let MEAT_LIST = MEAT_MENU;
let VEG_LIST  = VEG_MENU;

function loadConfig() {
  try {
    const s = localStorage.getItem(CONFIG_KEY);
    if (!s) return;
    const c = JSON.parse(s);
    if (Array.isArray(c.meat) && c.meat.length) MEAT_LIST = c.meat;
    if (Array.isArray(c.veg)  && c.veg.length)  VEG_LIST  = c.veg;
  } catch (e) { /* 配置损坏时忽略，使用默认 */ }
}

function saveConfig() {
  try {
    localStorage.setItem(CONFIG_KEY, JSON.stringify({ meat: MEAT_LIST, veg: VEG_LIST }));
    return true;
  } catch (e) {
    alert("保存失败：图片过大或浏览器存储空间不足，建议改用图片链接而不是本地上传。");
    return false;
  }
}

function dishImg(dish, cat) {
  return dish.img || DEFAULT_IMGS[cat];
}

loadConfig();

/* ================= 配置 ================= */
const SPIN_DURATION = 3000;   // 滚动时长 3 秒
const ITEM_H = 44;            // 单项高度，与 CSS 保持一致
const WINDOW_H = 68;
const VISIBLE = Math.ceil(WINDOW_H / ITEM_H); // 可见条数

/* ================= 工具 ================= */
function buildTrack(trackEl, menu) {
  // 复制菜单若干遍，保证 3 秒内滚不完，且停止时后方还有内容
  const list = [];
  for (let i = 0; i < 20; i++) list.push(...menu);
  trackEl.innerHTML = "";
  list.forEach(d => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = d.name;
    trackEl.appendChild(div);
  });
  return list;
}

function pickRandom(menu) {
  return menu[Math.floor(Math.random() * menu.length)];
}

/* ================= 滚动逻辑 ================= */
function spinOne(trackEl, menu, onDone) {
  const list = buildTrack(trackEl, menu);
  const items = trackEl.children;
  const total = items.length;
  const totalH = total * ITEM_H;

  // 目标：随机停在一个"有足够后续内容"的位置（后半段区域）
  const targetIdx = Math.floor(total / 2) + Math.floor(Math.random() * (total / 2 - VISIBLE));
  // 让目标项停在中线：offset = targetTop + ITEM_H/2 - WINDOW_H/2
  const targetTop = targetIdx * ITEM_H;
  const finalOffset = targetTop + ITEM_H / 2 - WINDOW_H / 2;

  const start = performance.now();
  const startOffset = -ITEM_H; // 从略上方开始

  function frame(now) {
    const t = Math.min((now - start) / SPIN_DURATION, 1);
    // easeOutQuart：先快后慢，模拟滚轮减速
    const ease = 1 - Math.pow(1 - t, 4);
    const offset = startOffset + (finalOffset - startOffset) * ease;
    trackEl.style.transform = `translateY(${-offset}px)`;

    // 高亮中线附近的项
    const centerIdx = Math.round((offset + WINDOW_H / 2) / ITEM_H - 0.5);
    for (let i = 0; i < total; i++) {
      items[i].classList.toggle("active", i === centerIdx);
    }

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      const dish = list[targetIdx];
      onDone(dish);
    }
  }
  requestAnimationFrame(frame);
}

/* ================= 主流程 ================= */
const startBtn = document.getElementById("startBtn");
const resultHint = document.getElementById("resultHint");
const recipeArea = document.getElementById("recipeArea");
let spinning = false;

startBtn.addEventListener("click", () => {
  if (spinning) return;
  spinning = true;
  startBtn.disabled = true;
  resultHint.textContent = "正在为你抽取今日菜单…";
  recipeArea.innerHTML = "";

  let results = {};
  let doneCount = 0;
  const finish = () => {
    doneCount++;
    if (doneCount < 2) return;
    renderRecipes([
      { dish: results.meat, cat: "meat" },
      { dish: results.veg,  cat: "veg"  }
    ]);
    addRecord(results.meat, results.veg);
    resultHint.textContent = `今日菜单：${results.meat.name} + ${results.veg.name}，开动吧！`;
    spinning = false;
    startBtn.disabled = false;
  };

  spinOne(document.getElementById("trackMeat"), MEAT_LIST, d => { results.meat = d; finish(); });
  spinOne(document.getElementById("trackVeg"),  VEG_LIST,  d => { results.veg  = d; finish(); });
});

/* ================= 渲染菜谱 ================= */
function renderRecipes(dishes) {
  recipeArea.innerHTML = "";
  dishes.forEach((entry, i) => {
    const { dish, cat } = entry;
    const card = document.createElement("div");
    card.className = "recipe-card";
    card.style.animationDelay = `${i * 0.15}s`;
    card.innerHTML = `
      <h2>🍽️ ${dish.name}</h2>
      <span class="tag">具体做法 · 共 ${dish.steps.length} 步</span>
      <img class="recipe-img" src="${dishImg(dish, cat)}" alt="${dish.name}">
      <ol>${dish.steps.map(s => `<li>${s}</li>`).join("")}</ol>
    `;
    recipeArea.appendChild(card);
  });
}

/* ================= 图片放大灯箱 ================= */
const imgLightbox = document.getElementById("imgLightbox");
const lightboxImg = document.getElementById("lightboxImg");
recipeArea.addEventListener("click", e => {
  if (e.target.classList.contains("recipe-img")) {
    lightboxImg.src = e.target.src;
    imgLightbox.classList.add("show");
  }
});
imgLightbox.addEventListener("click", () => imgLightbox.classList.remove("show"));

/* ================= 自定义配置弹窗 ================= */
const cfgModal   = document.getElementById("cfgModal");
const cfgBody    = document.getElementById("cfgBody");
const CAT_LABEL  = { meat: "🥩 荤菜区", veg: "🥬 素菜区" };

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function openCfg() {
  cfgBody.innerHTML = "";
  [["meat", MEAT_LIST], ["veg", VEG_LIST]].forEach(([cat, list]) => {
    const title = document.createElement("div");
    title.className = "cfg-cat-title";
    title.textContent = CAT_LABEL[cat];
    cfgBody.appendChild(title);

    list.forEach((dish, idx) => {
      const row = document.createElement("div");
      row.className = "cfg-dish";
      row.dataset.cat = cat;
      row.dataset.idx = idx;
      row.innerHTML = `
        <div class="cfg-img-box">
          <img class="cfg-preview" src="${dishImg(dish, cat)}" alt="">
          <button type="button" class="cfg-upload-btn">上传图片</button>
          <input type="file" accept="image/*" hidden>
        </div>
        <div class="cfg-fields">
          <input class="cfg-name" placeholder="菜名" value="${esc(dish.name)}">
          <textarea class="cfg-img-url" placeholder="图片链接（选填，留空使用默认图）">${esc(dish.img || "")}</textarea>
          <textarea class="cfg-steps" placeholder="做法步骤，每行一条">${esc(dish.steps.join("\n"))}</textarea>
        </div>
      `;
      // 本地上传：转 dataURL 并实时预览
      const fileInput = row.querySelector('input[type="file"]');
      row.querySelector(".cfg-upload-btn").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          row.dataset.localImg = reader.result;   // 存在行数据上，保存时读取
          row.querySelector(".cfg-preview").src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      // 图片链接输入变化时也更新预览
      row.querySelector(".cfg-img-url").addEventListener("change", e => {
        if (e.target.value.trim()) row.querySelector(".cfg-preview").src = e.target.value.trim();
        else row.querySelector(".cfg-preview").src = DEFAULT_IMGS[cat];
      });

      cfgBody.appendChild(row);
    });
  });
  cfgModal.classList.add("show");
}

function closeCfg() { cfgModal.classList.remove("show"); }

document.getElementById("settingsBtn").addEventListener("click", openCfg);
document.getElementById("cfgCloseBtn").addEventListener("click", closeCfg);
cfgModal.addEventListener("click", e => { if (e.target === cfgModal) closeCfg(); });

document.getElementById("cfgSaveBtn").addEventListener("click", () => {
  const newMeat = [], newVeg = [];
  cfgBody.querySelectorAll(".cfg-dish").forEach(row => {
    const cat  = row.dataset.cat;
    const name = row.querySelector(".cfg-name").value.trim();
    const img  = row.querySelector(".cfg-img-url").value.trim() || row.dataset.localImg || "";
    const steps = row.querySelector(".cfg-steps").value
      .split("\n").map(s => s.trim()).filter(Boolean);
    if (!name || !steps.length) return; // 跳过无效项
    (cat === "meat" ? newMeat : newVeg).push({ name, img, steps });
  });
  if (!newMeat.length || !newVeg.length) {
    alert("荤菜区和素菜区至少各保留 1 道有效菜品（需有菜名和步骤）。");
    return;
  }
  MEAT_LIST = newMeat;
  VEG_LIST  = newVeg;
  if (saveConfig()) {
    closeCfg();
    resultHint.textContent = "配置已保存，快来试试新菜单吧！";
  }
});

document.getElementById("cfgResetBtn").addEventListener("click", () => {
  if (!confirm("确定恢复默认菜单和图片吗？自定义配置将被清除。")) return;
  localStorage.removeItem(CONFIG_KEY);
  MEAT_LIST = MEAT_MENU;
  VEG_LIST  = VEG_MENU;
  openCfg(); // 重新渲染弹窗内容
  resultHint.textContent = "已恢复默认配置。";
});

/* ================= 历史记录 ================= */
const HISTORY_KEY = "mealPickerHistory";
const HISTORY_MAX = 100;   // 最多保留 100 条

const historyModal = document.getElementById("historyModal");
const historyBody  = document.getElementById("historyBody");

function getRecords() {
  try {
    const arr = JSON.parse(localStorage.getItem(HISTORY_KEY));
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function addRecord(meat, veg) {
  const records = getRecords();
  records.unshift({
    time: Date.now(),
    meat: meat.name,
    veg:  veg.name
  });
  if (records.length > HISTORY_MAX) records.length = HISTORY_MAX;
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(records));
  } catch (e) { /* 存储失败不影响抽奖 */ }
}

function formatTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, "0");
  const week = ["日","一","二","三","四","五","六"][d.getDay()];
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} 周${week}<br>${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function renderHistory() {
  const records = getRecords();
  if (!records.length) {
    historyBody.innerHTML = `<div class="history-empty">还没有记录，去抽一次吧～</div>`;
    return;
  }
  historyBody.innerHTML = `<div class="history-list">` + records.map((r, i) => `
    <div class="history-item" style="animation-delay:${Math.min(i * 0.03, 0.6)}s">
      <span class="hi-date">${formatTime(r.time)}</span>
      <span class="hi-dishes">🥩 <b>${esc(r.meat)}</b> ＋ 🥬 <b>${esc(r.veg)}</b></span>
    </div>
  `).join("") + `</div>`;
}

function openHistory() { renderHistory(); historyModal.classList.add("show"); }
function closeHistory() { historyModal.classList.remove("show"); }

document.getElementById("historyBtn").addEventListener("click", openHistory);
document.getElementById("historyCloseBtn").addEventListener("click", closeHistory);
historyModal.addEventListener("click", e => { if (e.target === historyModal) closeHistory(); });

document.getElementById("historyClearBtn").addEventListener("click", () => {
  if (!getRecords().length) return;
  if (!confirm("确定清空全部抽奖记录吗？")) return;
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
});
</script>
</body>
</html>
